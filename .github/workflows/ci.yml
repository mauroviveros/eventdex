name: CI

# shortcut: corre en cada push de cualquier branch, sumar `pull_request` y limitar push a main en F0 · bloque 7
on: push

# Un push nuevo cancela el run anterior de la misma rama: no tiene sentido
# terminar de verificar un commit que ya quedó viejo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Solo lo que valida src/lib/env.ts. Supabase se suma en F0 · bloque 7.
      NEXT_PUBLIC_ROOT_DOMAIN: eventdex.com

    steps:
      - uses: actions/checkout@v7

      # Sin `version:` — la toma de `packageManager` en el package.json de la
      # raíz. Así pnpm se actualiza en un solo lugar.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # La versión que declara `engines`, no la que usás local (24). Correr
          # el piso es lo que detecta que usaste una API que no existe ahí.
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` falla si el lockfile no coincide con los
      # package.json. Es lo que agarra el "commiteé la dependencia pero no el
      # lock", que en local no se nota porque tu node_modules ya la tiene.
      - run: pnpm install --frozen-lockfile

      # Pasos separados y no un `&&`: así la pestaña de Actions te dice cuál
      # falló sin abrir el log.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
